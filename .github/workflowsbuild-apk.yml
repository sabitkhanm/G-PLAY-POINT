name: Build G-POINT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'g_point_v1/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: g_point_v1
        run: flutter pub get

      - name: Analyze project
        working-directory: g_point_v1
        run: flutter analyze

      - name: Build APK
        working-directory: g_point_v1
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-POINT-Android-APK
          path: g_point_v1/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
